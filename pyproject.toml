[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "architectguard"
version = "0.2.0"
description = "Architectural decision watchdog and assumption drift monitor. Catch ADR decay before incidents happen."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ArchitectGuard Contributors"}
]
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0.0"]
ui = ["streamlit>=1.35", "matplotlib>=3.8"]
api = ["fastapi>=0.110.0", "uvicorn>=0.28.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = ["architectguard[ml,ui,api,dev]"]

[project.scripts]
ag = "cli.main:app"
architectguard = "cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "ui*"]
