name: 'ArchitectGuard Architecture Watchdog'
description: 'Automated architectural decision record (ADR) assumption tracking, live probe auditing, and risk propagation gate.'
author: 'Mohitgujjar07'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  project-dir:
    description: 'Path to repository root or directory containing .architectguard/'
    required: false
    default: '.'
  fail-on-expired:
    description: 'Fail step if any assumption has passed its expiration date'
    required: false
    default: 'true'
  fail-on-risk-above:
    description: 'Maximum allowable risk score before failing the step (0.1 - 1.0)'
    required: false
    default: '0.5'
  run-live-probes:
    description: 'Whether to execute configured live operational probes'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ArchitectGuard
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: Run Live Probes (if enabled)
      if: ${{ inputs.run-live-probes == 'true' }}
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        ag probe --auto-trip

    - name: Run Architecture Health Gate
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        ag check --fail-on-expired=${{ inputs.fail-on-expired }} --fail-on-risk-above=${{ inputs.fail-on-risk-above }}
