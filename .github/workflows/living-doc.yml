name: Update Living Architecture Spec

on:
  push:
    branches: [main, master]
    paths:
      - '.architectguard/**'
      - '.assumptionpulse/**'
      - 'docs/adr/**'
      - 'data/**'

permissions:
  contents: write

jobs:
  update-spec:
    name: Auto-generate CURRENT_ARCHITECTURE.md
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ArchitectGuard
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Export Architecture Markdown
        run: |
          mkdir -p docs
          ag export --format markdown --output docs/CURRENT_ARCHITECTURE.md

      - name: Commit and Push Updated Spec
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_ARCHITECTURE.md
          if git diff --staged --quiet; then
            echo "No architectural changes detected."
          else
            git commit -m "docs: auto-update living architecture specification [skip ci]"
            git push
          fi
