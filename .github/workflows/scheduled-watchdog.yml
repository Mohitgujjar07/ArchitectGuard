name: Scheduled Production Watchdog

on:
  schedule:
    # Run every Monday at 08:00 UTC (start of work week)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  issues: write
  contents: read

jobs:
  watchdog:
    name: Verify Live Probes & Expirations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ArchitectGuard
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Watchdog Probes & Expiry Audits
        id: watchdog_run
        continue-on-error: true
        run: |
          mkdir -p .artifacts
          ag check --fail-on-expired --fail-on-risk-above 0.5 > .artifacts/audit.txt 2>&1 || echo "FAILED" > .artifacts/failed.txt
          ag export --format markdown > .artifacts/report.md

      - name: Create GitHub Issue on Architecture Incident
        if: steps.watchdog_run.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditLog = fs.existsSync('.artifacts/audit.txt') ? fs.readFileSync('.artifacts/audit.txt', 'utf8') : 'Audit failure detected.';
            const report = fs.existsSync('.artifacts/report.md') ? fs.readFileSync('.artifacts/report.md', 'utf8') : '';

            const title = '🚨 [ArchitectGuard Alert] Architectural Assumptions Expired or High Risk Detected';
            const body = `## ⚠️ Weekly Architecture Watchdog Failure\n\nOne or more operational premises or expiration dates have been violated in production.\n\n### Audit Log\n\`\`\`text\n${auditLog}\n\`\`\`\n\n### Current Graph State\n${report}\n\n*Assigned to engineering team for review.*`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['architecture-incident', 'bug']
            });
