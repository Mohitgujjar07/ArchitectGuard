name: Pull Request Architecture Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  audit-architecture:
    name: Audit ADR Assumptions & Blast Radius
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ArchitectGuard
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate Architecture Audit Report
        id: report
        run: |
          mkdir -p .artifacts
          # Run check and capture output
          ag check --fail-on-expired --fail-on-risk-above 0.5 > .artifacts/audit.txt 2>&1 || echo "FAILED" > .artifacts/status.txt
          ag export --format markdown > .artifacts/summary.md

      - name: Post Comment to Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('.artifacts/summary.md', 'utf8');
            const isFailed = fs.existsSync('.artifacts/status.txt');

            const statusBadge = isFailed 
              ? '### 🚨 ArchitectGuard Alert: Architecture Risk Detected' 
              : '### 🛡️ ArchitectGuard: All Architecture Premises Verified';

            const body = `${statusBadge}\n\n${summary}\n\n*Automated review generated by [ArchitectGuard](https://github.com/Mohitgujjar07/ArchitectGuard)*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Enforce Architecture Merge Gate
        run: |
          if [ -f .artifacts/status.txt ]; then
            echo "::error::ArchitectGuard audit failed! Pull request contains expired premises or high-risk decisions."
            exit 1
          fi
          echo "Architecture audit clean."
